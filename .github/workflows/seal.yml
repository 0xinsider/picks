name: Seal

# Append every new pre-game commitment to the ledger.
#
# THIS WORKFLOW COMPUTES NO HASH. It fetches the ledger endpoint, diffs the
# result against what is committed here, and appends the difference. Every hash
# is produced by the backend at seal time and copied byte for byte. A mirror
# that derived its own hash would prove only that it can run sha256, and the
# first disagreement between two serializations would read to a stranger as a
# falsified record rather than as the formatting bug it is. `verify.py` checks
# contents offline; the signed receipt below adds independent timing evidence.
#
# TIMING IS THE WHOLE POINT. A pick publishes one hour before kickoff and is
# sealed in the same pass, so the hash is available to this workflow for about
# 60 minutes before the game starts. Git author dates are writer controlled.
# A signed receipt for the pushed commit can provide an independent witness
# time. Only a verified receipt timestamp before kickoff supports that claim;
# a late receipt does not upgrade a pick.
#
# THE BACKEND DISPATCHES THIS WORKFLOW the moment it seals a pick
# (0xinsider/0xinsider#15900), so the hash normally lands within a minute or two.
# The dispatch only says "now": this workflow still fetches, diffs and commits,
# and the backend never writes here. The schedule below is the fallback, and it
# is not enough on its own. On 2026-09-20 GitHub delivered 2 of about 31
# scheduled runs between 18:52Z and 23:59Z. The minutes are offset from :00,
# where GitHub sheds the most scheduled runs.
#
# WINDOW. Picks drop between 11:00 UTC and 23:00 US Eastern, one hour before
# the latest kickoff that still counts as the product day (OP_WINDOW_START_UTC
# and operating_window_end_for in the backend, 0xinsider/0xinsider#16207).
# 23:00 ET is 03:00 UTC in summer and 04:00 UTC in winter, so the window
# crosses UTC midnight: hours 11-23 cover the daytime drops and hours 0-4 cover
# the late slate, Monday Night Football and the West Coast games. The 04:57 run
# covers a 04:00 drop whose kickoff is 05:00 UTC.
#
# NO CURSOR. The repository is the cursor. A missed run self-heals on the next
# one, and running this twice in a row writes nothing the second time.
#
# NO CREDENTIAL. The ledger endpoint is public (0xinsider/0xinsider#16459), so
# this workflow holds no secret and nothing it reads can be revoked. It sent
# OXINSIDER_API_KEY until 2026-09-22, when a routine key rotation on the account
# that owned that key revoked it -- one active key per user -- and every Seal and
# Reveal run failed 401 from 14:51Z while picks were reaching kickoff unsealed,
# which is permanent for those picks. Do not add a key back here. What can still
# fail the run, and should: an error response, an unexpected shape, or a sealed
# pick carrying a nonce.

on:
  schedule:
    - cron: "7-59/10 0-4,11-23 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Apply to the working tree and show the diff without committing"
        type: boolean
        default: false

permissions: {}

concurrency:
  # Shared with reveal.yml: both write the same files, so they take turns. A
  # queued run that gets dropped for a newer one costs nothing, because neither
  # keeps a cursor.
  group: ledger-write
  cancel-in-progress: false

jobs:
  seal:
    if: github.repository == '0xinsider/picks'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out the ledger
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          # Full history: mirror.py dates the first sealed commitment from it,
          # and refuses a shallow clone rather than guess.
          fetch-depth: 0
          persist-credentials: true

      - name: Remember the ledger head
        id: before
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Append new commitments
        run: |
          python3 .github/scripts/mirror.py --mode seal \
            ${{ inputs.dry_run && '--no-push' || '' }}

      - name: Prepare a receipt for the pushed head
        id: receipt
        if: ${{ !inputs.dry_run }}
        env:
          BEFORE: ${{ steps.before.outputs.sha }}
        run: |
          after=$(git rev-parse HEAD)
          if [ "$after" = "$BEFORE" ]; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          remote=$(git ls-remote --exit-code origin refs/heads/main | cut -f1)
          if [ "$remote" != "$after" ]; then
            echo "Refusing to attest a commit that is not on main" >&2
            exit 1
          fi
          printf '%s\n' "$after" > "$RUNNER_TEMP/pick-seal-commit.txt"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Attest the pushed commit
        if: ${{ steps.receipt.outputs.created == 'true' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/pick-seal-commit.txt

      - name: Show the uncommitted diff
        if: ${{ inputs.dry_run }}
        run: git --no-pager diff
