name: Seal

# Append every new pre-game commitment to the ledger.
#
# THIS WORKFLOW COMPUTES NO HASH. It fetches the ledger endpoint, diffs the
# result against what is committed here, and appends the difference. Every hash
# is produced by the backend at seal time and copied byte for byte. A mirror
# that derived its own hash would prove only that it can run sha256, and the
# first disagreement between two serializations would read to a stranger as a
# falsified record rather than as the formatting bug it is. `verify.py` checks
# contents offline; the signed receipt below adds independent timing evidence.
#
# TIMING IS THE WHOLE POINT. A pick publishes when it qualifies, which is at
# most 4 hours and at least 30 minutes before its kickoff, and it is sealed in
# the same pass. So the hash is available to this workflow for between 30
# minutes and 4 hours before the game starts. The ledger shows it: the 76 picks
# dated 2026-10-30 to 2026-11-03 sealed 0.58 to 3.99 hours before kickoff,
# median 3.81. Before 2026-10-29 there was no 4-hour bound, and a pick could
# seal up to 19 hours ahead. Git author dates are writer controlled.
# A signed receipt for the pushed commit can provide an independent witness
# time. Only a verified receipt timestamp before kickoff supports that claim;
# a late receipt does not upgrade a pick.
#
# THE BACKEND DISPATCHES THIS WORKFLOW the moment it seals a pick,
# so the hash normally lands within a minute or two.
# The dispatch only says "now": this workflow still fetches, diffs and commits,
# and the backend never writes here. The schedule below is the fallback, and it
# is not enough on its own. On 2026-09-20 GitHub delivered 2 of about 31
# scheduled runs between 18:52Z and 23:59Z. The minutes are offset from :00,
# where GitHub sheds the most scheduled runs.
#
# WINDOW. Picks publish from 03:00 to 23:30 US Eastern, and the latest kickoff
# that still counts as the product day is midnight Eastern. In UTC that is
# 07:00 to 04:00 the next morning in summer and 08:00 to 05:00 in winter, so
# the window crosses UTC midnight: hours 7-23 cover the daytime drops and
# hours 0-4 cover the late slate, Monday Night Football and the West Coast
# games. The 04:57 run covers a 04:30 drop whose kickoff is 05:00 UTC. Until
# 2026-11-03 the schedule started at 11:00 UTC, so a drop between 07:00 and
# 11:00 UTC had the dispatch and no fallback.
#
# NO CURSOR. The repository is the cursor. A missed run self-heals on the next
# one, and running this twice in a row writes nothing the second time.
#
# NO CREDENTIAL. The ledger endpoint is public, so
# this workflow holds no secret and nothing it reads can be revoked. It sent
# an API key until 2026-09-22, when a routine key rotation on the account
# that owned that key revoked it -- one active key per user -- and every Seal and
# Reveal run failed 401 from 14:51Z while picks were reaching kickoff unsealed,
# which is permanent for those picks. Do not add a key back here. What can still
# fail the run, and should: an error response, an unexpected shape, or a sealed
# pick carrying a nonce.

on:
  schedule:
    - cron: "7-59/10 0-4,7-23 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Apply to the working tree and show the diff without committing"
        type: boolean
        default: false
      attest_current:
        description: "Also sign the current main head if no commit changed; late receipts do not prove pregame timing"
        type: boolean
        default: false

permissions: {}

concurrency:
  # Shared with reveal.yml: both write the same files, so they take turns. A
  # queued run that gets dropped for a newer one costs nothing, because neither
  # keeps a cursor.
  group: ledger-write
  cancel-in-progress: false

jobs:
  seal:
    if: github.repository == '0xinsider/picks'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out the ledger
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          # Full history: mirror.py dates the first sealed commitment from it,
          # and refuses a shallow clone rather than guess.
          fetch-depth: 0
          persist-credentials: true

      - name: Remember the ledger head
        id: before
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Append new commitments
        run: |
          python3 .github/scripts/mirror.py --mode seal \
            ${{ inputs.dry_run && '--no-push' || '' }}

      - name: Prepare a receipt for the pushed head
        id: receipt
        if: ${{ !inputs.dry_run }}
        env:
          BEFORE: ${{ steps.before.outputs.sha }}
        run: |
          after=$(git rev-parse HEAD)
          if [ "$after" = "$BEFORE" ] && [ "${{ inputs.attest_current }}" != "true" ]; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          remote=$(git ls-remote --exit-code origin refs/heads/main | cut -f1)
          if [ "$remote" != "$after" ]; then
            echo "Refusing to attest a commit that is not on main" >&2
            exit 1
          fi
          printf '%s\n' "$after" > "$RUNNER_TEMP/pick-seal-commit.txt"
          echo "created=true" >> "$GITHUB_OUTPUT"

      # THE RECEIPT GETS THREE TRIES. The commit is already on main when this
      # runs, and no later run attests it: the next run starts from it and
      # signs only its own commit. So a receipt this run fails to create is
      # lost for good. On 2026-11-02 Seal run 41409921791 pushed bc2065b
      # (pick 2019) and then failed here, once, on "Failed to get ID token ...
      # socket hang up", a transient error from the token service; VERIFY.md,
      # "Seal commits without a receipt", lists that commit. The first two
      # attempts continue on error, so the next one can run (`outcome` is the
      # result before continue-on-error, `conclusion` after it). The third
      # does not, so a receipt that never arrives still fails the run.
      - name: Attest the pushed commit
        id: attest_1
        if: ${{ steps.receipt.outputs.created == 'true' }}
        continue-on-error: true
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/pick-seal-commit.txt

      - name: Wait before the second receipt attempt
        if: ${{ steps.attest_1.outcome == 'failure' }}
        run: sleep 15

      - name: Attest the pushed commit, second attempt
        id: attest_2
        if: ${{ steps.attest_1.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/pick-seal-commit.txt

      - name: Wait before the last receipt attempt
        if: ${{ steps.attest_2.outcome == 'failure' }}
        run: sleep 45

      - name: Attest the pushed commit, last attempt
        id: attest_3
        if: ${{ steps.attest_2.outcome == 'failure' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/pick-seal-commit.txt

      - name: Name the commit left without a receipt
        if: ${{ failure() && steps.attest_3.outcome == 'failure' }}
        run: |
          echo "::error::Seal commit $(cat "$RUNNER_TEMP/pick-seal-commit.txt") is on main with no receipt. Add it to VERIFY.md, \"Seal commits without a receipt\"."

      - name: Show the uncommitted diff
        if: ${{ inputs.dry_run }}
        run: git --no-pager diff
